<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Illustration of a Beagle">
  <rect width="200" height="160" fill="#f4f1ea"/>
  <!-- body -->
  <ellipse cx="100" cy="110" rx="62" ry="34" fill="#f3e9d2"/>
  <!-- head -->
  <circle cx="100" cy="70" r="38" fill="#f3e9d2"/>
  <!-- floppy ears -->
  <ellipse cx="66" cy="64" rx="16" ry="30" fill="#5a3a22"/>
  <ellipse cx="134" cy="64" rx="16" ry="30" fill="#5a3a22"/>
  <!-- brown patch over eye -->
  <path d="M88 44 q14 -10 26 0 q4 18 -12 26 q-18 -6 -14 -26 z" fill="#5a3a22"/>
  <!-- eyes -->
  <circle cx="90" cy="66" r="4.5" fill="#2b2b2b"/>
  <circle cx="112" cy="66" r="4.5" fill="#2b2b2b"/>
  <!-- nose -->
  <ellipse cx="101" cy="82" rx="7" ry="5" fill="#2b2b2b"/>
  <!-- smile -->
  <path d="M92 92 q9 8 18 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="74" y="132" width="12" height="20" rx="4" fill="#f3e9d2"/>
  <rect x="114" y="132" width="12" height="20" rx="4" fill="#f3e9d2"/>
  <!-- tail -->
  <path d="M160 100 q22 -6 18 -26" stroke="#5a3a22" stroke-width="9" fill="none" stroke-linecap="round"/>
</svg>
