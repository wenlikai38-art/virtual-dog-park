<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" role="img" aria-label="Illustration of a Poodle">
  <rect width="200" height="160" fill="#f3eef7"/>
  <!-- fluffy body -->
  <ellipse cx="100" cy="114" rx="50" ry="32" fill="#e9e2ef"/>
  <circle cx="78" cy="118" r="16" fill="#e9e2ef"/>
  <circle cx="122" cy="118" r="16" fill="#e9e2ef"/>
  <circle cx="100" cy="128" r="18" fill="#e9e2ef"/>
  <!-- head -->
  <circle cx="100" cy="66" r="34" fill="#e9e2ef"/>
  <!-- top pom -->
  <circle cx="100" cy="34" r="14" fill="#e9e2ef"/>
  <!-- ears (curly) -->
  <circle cx="70" cy="66" r="12" fill="#d8cee2"/>
  <circle cx="130" cy="66" r="12" fill="#d8cee2"/>
  <!-- eyes -->
  <circle cx="90" cy="64" r="4.5" fill="#2b2b2b"/>
  <circle cx="110" cy="64" r="4.5" fill="#2b2b2b"/>
  <!-- nose -->
  <ellipse cx="100" cy="78" rx="6" ry="4.5" fill="#2b2b2b"/>
  <!-- smile -->
  <path d="M91 86 q9 7 18 0" stroke="#2b2b2b" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="84" y="134" width="11" height="18" rx="4" fill="#e9e2ef"/>
  <rect x="105" y="134" width="11" height="18" rx="4" fill="#e9e2ef"/>
  <!-- curly tail -->
  <circle cx="150" cy="100" r="10" fill="#e9e2ef"/>
</svg>
